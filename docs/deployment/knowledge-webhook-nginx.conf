# Run under a provisioned private nginx prefix; validate with nginx -t before activation.
worker_processes 1;
pid nginx.pid;
# Runtime error diagnostics may contain full request targets or headers at any level.
# Discard them; retain nginx -t startup validation separately before activation.
error_log /dev/null;
events { worker_connections 256; }
http {
    server_tokens off;
    # Only fixed route labels and numeric response metadata enter runtime logs.
    log_format webhook 'route=$webhook_route status=$status duration=$request_time';
    access_log logs/access.log webhook;
    client_body_temp_path tmp/body;
    proxy_temp_path tmp/proxy;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 5s;
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 30s;
    # Raw request target whitelist rejects query strings, encoded alternatives,
    # doubled slashes and normalization aliases even when location normalizes.
    map $request_uri $webhook_route {
        default rejected;
        /webhook centaur;
        /api/publications/github publisher;
    }
    server {
        listen 127.0.0.1:8644;
        server_name _;
        if ($webhook_route = rejected) { return 404; }
        if ($request_method != POST) { return 405; }
        # Optional Centaur receiver; remove this location and its map entry when unused.
        location = /webhook {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Authorization "";
            proxy_pass http://127.0.0.1:8642;
        }
        location = /api/publications/github {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Authorization "";
            proxy_pass http://127.0.0.1:8643;
        }
        location / { return 404; }
    }
}
